server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # OBR's own frontend fetches this cross-origin to read the extension's
    # config, so it needs CORS — without this, adding the extension by URL
    # fails silently in OBR's UI.
    location = /manifest.json {
        add_header Access-Control-Allow-Origin *;
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
