server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # OBR's own frontend fetches this cross-origin to read the extension's
    # config, so it needs CORS — without this, adding the extension by URL
    # fails silently in OBR's UI. no-cache forces revalidation on every
    # fetch — without it, browsers can serve a stale manifest (wrong name/
    # icon) after a rename, since manifest.json's filename never changes.
    location = /manifest.json {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache";
        default_type application/json;
    }

    # OBR fetches icon files cross-origin too (via JS, not a plain <img>) —
    # almost certainly to inline the SVG into its own DOM so it can recolor/
    # theme it to match the toolbar. Confirmed via browser console: without
    # this header the fetch is silently blocked and the icon renders blank,
    # even though a bare curl/browser-navigation request returns 200 fine.
    location ~* \.svg$ {
        add_header Access-Control-Allow-Origin *;
        default_type image/svg+xml;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
